[project]
name = "conversor-unidades"
version = "1.0.0"
description = "Conversor de unidades de línea de comandos"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, N: pep8-naming,
# UP: pyupgrade, B: bugbear, SIM: simplificaciones
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
